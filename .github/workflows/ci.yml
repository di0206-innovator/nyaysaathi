name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Lint & Static Analysis
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 2. Typecheck
  typecheck:
    name: Typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  # 3. Unit Tests & OCR Provenance
  unit:
    name: Unit Tests & OCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test
        env:
          NODE_ENV: test

  # 4. Security & Rate Limiting Concurrency
  security:
    name: Security & Concurrency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Security & Concurrency Regression Tests
        run: npx tsx --test tests/document-upload-security.test.ts tests/document-comparison-security.test.ts tests/prompt1-production-security.test.ts tests/security-regression.test.ts tests/rate-limiter-concurrency.test.ts tests/production-durability-and-storage.test.ts tests/adversarial-security-and-quality.test.ts
        env:
          NODE_ENV: test

  # 5. AI Evaluation & Evidence Grounding
  ai-evaluation:
    name: AI Trust & Grounding Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Grounding & Anti-Hallucination Benchmarks
        run: npx tsx --test tests/qa-grounding-validator.test.ts tests/prompt2-ai-evaluation.test.ts tests/evidence-enforcement.test.ts tests/failure-paths.test.ts tests/promptwars-evaluation-audit.test.ts
        env:
          NODE_ENV: test

  # 6. Supabase RLS Integration
  integration:
    name: Supabase RLS Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run RLS Multi-Tenant Isolation Tests
        run: npx tsx --test tests/supabase-rls-integration.test.ts tests/phase8-production-integrity.test.ts
        env:
          NODE_ENV: test
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}

  # 7. Accessibility (axe-core & WCAG 2.2 AA)
  accessibility:
    name: Accessibility & WCAG 2.2 AA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Accessibility Audit
        run: npx tsx --test tests/prompt3-accessibility.test.ts tests/accessibility-audit.test.ts tests/accessibility-axe.test.ts
        env:
          NODE_ENV: test

  # 8. E2E Tests
  e2e:
    name: E2E Lifecycle Journey
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run E2E Smoke & Journey Tests
        run: npx tsx --test tests/e2e-journey.test.ts tests/phase6-production-readiness.test.ts
        env:
          NODE_ENV: test

  # 9. Browser E2E (Playwright)
  playwright:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application for Playwright Testing
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: production

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Multi-Viewport Test Suite
        run: npx playwright test
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:3000'

      - name: Upload Playwright Test Report & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # 10. Production Build
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, security, ai-evaluation, accessibility, e2e, playwright]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: production
